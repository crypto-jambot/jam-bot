steps:
  - name: gcr.io/cloud-builders/gcloud
    id: Download JAR
    entrypoint: bash
    args:
      - "-c"
      - |
        VERSION=$(gsutil ls gs://cloud-run-apps/artifacts/$_SERVICE_NAME | grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+' | sort -V | tail -1)
        gsutil cp gs://cloud-run-apps/artifacts/$_SERVICE_NAME/$$VERSION/* .
  - name: gcr.io/cloud-builders/docker
    id: Dockerize Artifact
    entrypoint: docker
    args:
      [
        "build",
        "--build-arg",
        "JAR_FILE=$_SERVICE_NAME.jar",
        "-t",
        "gcr.io/$PROJECT_ID/$_SERVICE_NAME:$COMMIT_SHA",
        "."
      ]
  - name: gcr.io/cloud-builders/docker
    id: Pushing docker image to container registry
    args: [ 'push', 'gcr.io/$PROJECT_ID/$_SERVICE_NAME:$COMMIT_SHA' ]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: Deploying to ${_REGION}
    entrypoint: gcloud
    args:
      [
        'run',
        'deploy',
        '$_SERVICE_NAME',
        '--image',
        'gcr.io/$PROJECT_ID/$_SERVICE_NAME:$COMMIT_SHA',
        '--region',
        '$_REGION',
        '--service-account',
        '$_SERVICE_ACCOUNT',
        '--memory=$_MEMORY',
        '--cpu=$_CPU',
        '--cpu-boost',
        '--concurrency=$_CONCURRENCY',
        '--min-instances=$_MIN_INSTANCES',
        '--execution-environment=$_EXECUTION_ENVIRONMENT',
        '--set-env-vars',
        'JAVA_OPTS=$_JAVA_OPTS',
        '--set-env-vars',
        "JAVA_TOOL_OPTIONS=$_JAVA_TOOL_OPTIONS",
        "--set-env-vars",
        'DATABASE=$_DATABASE',
        '--set-env-vars',
        'DB_USER=$_DB_USER',
        '--set-env-vars',
        'CLUSTER_URL=$_CLUSTER_URL'
      ]
images:
  - gcr.io/$PROJECT_ID/$_SERVICE_NAME:$COMMIT_SHA
substitutions:
  _REGION: us-central1
  _SERVICE_ACCOUNT: jam-bot@crypto-351521.iam.gserviceaccount.com
  _SERVICE_NAME: jam-bot
  _MEMORY: 4Gi
  _CPU: 4000m
  _MIN_INSTANCES: "10"
  _CONCURRENCY: "5"
  _JAVA_OPTS: "-Xmx3500m -Xms3500m -XX:NativeMemoryTracking=summary -XX:+UnlockDiagnosticVMOptions -XX:+PrintNMTStatistics"
  _JAVA_TOOL_OPTIONS: "-XX:+TieredCompilation -XX:TieredStopAtLevel=1"
  _EXECUTION_ENVIRONMENT: gen2
  _DATABASE: ethereum
  _DB_USER: jam
  _CLUSTER_URL: ethereum.oovx2.mongodb.net
options:
  substitution_option: ALLOW_LOOSE
